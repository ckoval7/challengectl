---
# ChallengeCtl Runner Configuration Example
# Copy this file to runner-config.yml and customize for each runner

runner:
  # Unique identifier for this runner
  # Choose a unique ID for this runner (e.g., "sdr-station-1", "runner-west")
  runner_id: "runner-1"

  # Server URL (use HTTPS in production)
  server_url: "https://192.168.1.100:8443"

  # === RUNNER ENROLLMENT ===
  # For first-time setup:
  #   1. Go to the Web UI -> Runners page -> Click "Add Runner"
  #   2. Generate an enrollment token and API key
  #   3. Copy them here:
  #
  # enrollment_token: "PASTE-ENROLLMENT-TOKEN-HERE"
  # api_key: "PASTE-API-KEY-HERE"
  #
  # On first run, the runner will enroll itself and you should then:
  #   4. Remove the enrollment_token line from this file
  #   5. Keep the api_key line and restart the runner
  #
  # For already-enrolled runners, only the api_key is needed:
  api_key: "PASTE-YOUR-API-KEY-HERE"

  # TLS/SSL Configuration
  # Path to CA certificate file for server verification
  # Leave blank to use system CA certificates
  ca_cert: ""

  # Set to false to disable SSL verification (DEVELOPMENT ONLY!)
  # In production, always use verify_ssl: true with proper certificates
  verify_ssl: true

  # Cache directory for downloaded challenge files (relative to runner directory)
  cache_dir: "cache"

  # Heartbeat interval (seconds) - how often to ping server
  heartbeat_interval: 30

  # Poll interval (seconds) - how often to request new tasks
  poll_interval: 10

  # Spectrum Paint Pre-Challenge
  # Set to true to fire spectrum paint before each challenge
  # This matches the behavior of the original challengectl
  spectrum_paint_before_challenge: true

# Radio/SDR Device Configuration
# Same format as standalone challengectl-v2
radios:
  # Model defaults
  models:
  - model: hackrf
    rf_gain: 14
    if_gain: 32
    bias_t: true
    rf_samplerate: 2000000
    ppm: 0

  - model: bladerf
    rf_gain: 43
    bias_t: true
    rf_samplerate: 2000000
    ppm: 0
    # antenna: TX1  # Optional: specify antenna port

  - model: usrp
    rf_gain: 20
    bias_t: false
    rf_samplerate: 2000000
    ppm: 0

  # Individual device configuration
  devices:
  # HackRF Example (by index) - Legacy single antenna format
  - name: 0
    model: hackrf
    rf_gain: 14
    if_gain: 32
    frequency_limits:
      - "144000000-148000000"  # 2m ham band
      - "420000000-450000000"  # 70cm ham band

  # BladeRF Example - Multi-antenna format (NEW)
  # This format allows different frequency limits and gain per antenna
  # - name: "1234567890abcdef"
  #   model: bladerf
  #   rf_gain: 43  # Default gain (used if not specified per-antenna)
  #   bias_t: true
  #   antennas:
  #     TX1:
  #       rf_gain: 43  # Optimal gain for VHF/UHF
  #       frequency_limits:
  #         - "144000000-148000000"  # 2m on TX1
  #         - "420000000-450000000"  # 70cm on TX1
  #     TX2:
  #       rf_gain: 50  # Higher gain for 900 MHz/2.4 GHz
  #       frequency_limits:
  #         - "900000000-915000000"  # 900 MHz on TX2
  #         - "2400000000-2500000000"  # 2.4 GHz on TX2

  # USRP Example - Multi-antenna format
  # - name: "type=b200"
  #   model: usrp
  #   rf_gain: 20  # Default gain
  #   antennas:
  #     TX/RX:
  #       rf_gain: 25  # Specific gain for this antenna
  #       frequency_limits:
  #         - "70000000-6000000000"  # Full range on TX/RX port

  # Example with disabled antenna (e.g., for maintenance)
  # - name: "abcdef1234567890"
  #   model: bladerf
  #   rf_gain: 43
  #   bias_t: true
  #   antennas:
  #     TX1:
  #       enabled: true
  #       rf_gain: 40
  #       frequency_limits:
  #         - "144000000-148000000"
  #         - "420000000-450000000"
  #     TX2:
  #       enabled: false  # Temporarily disabled (antenna under maintenance)
  #       rf_gain: 50
  #       frequency_limits:
  #         - "900000000-915000000"
  #         - "2400000000-2500000000"

  # Mixed Example - Single antenna on older device
  # - name: 1
  #   model: hackrf
  #   antenna: ""  # HackRF has single antenna
  #   frequency_limits:
  #     - "1000000-6000000000"  # Full HackRF range

# Notes:
# - Device names can be index numbers (0, 1, 2) or serial numbers/identifiers
# - Two configuration formats are supported:
#   1. Legacy: 'antenna' + 'frequency_limits' (single antenna per device)
#   2. New: 'antennas' dict with per-antenna frequency_limits and rf_gain (multi-antenna devices)
# - The runner automatically selects the appropriate antenna based on challenge frequency
# - frequency_limits are optional - if not set, antenna accepts any frequency
# - Antennas can be temporarily disabled by setting 'enabled: false' (default is true)
# - Disabled antennas will be skipped during antenna selection
# - bias_t and other device settings are still specified at device level
# - Gain configuration:
#   * rf_gain can be specified per-antenna (recommended) or at device level
#   * Per-antenna rf_gain overrides device-level rf_gain
#   * if_gain is device-level only (HackRF specific)
#   * rf_gain values depend on device type and frequency band
